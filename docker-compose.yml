{
  "x-generated": "Run python scripts/generate-domain-config.py after editing config/domains.json",
  "services": {
    "domain-b-ldap": {
      "build": {
        "context": "./ldap",
        "args": {
          "LDAP_USERS_LDIF": "50-domain-b-users.ldif"
        }
      },
      "environment": {
        "LDAP_ORGANISATION": "Consoto Domain B",
        "LDAP_DOMAIN": "b.consoto.com",
        "LDAP_ADMIN_PASSWORD": "ldap-admin-poc-only",
        "LDAP_TLS": "false"
      },
      "volumes": [
        "domain-b-ldap:/var/lib/ldap",
        "domain-b-ldap-config:/etc/ldap/slapd.d"
      ],
      "networks": [
        "service-inout"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=b,dc=consoto,dc=com' -w \"$$LDAP_ADMIN_PASSWORD\" -b 'dc=b,dc=consoto,dc=com' -s base dn >/dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      }
    },
    "domain-c-ldap": {
      "build": {
        "context": "./ldap",
        "args": {
          "LDAP_USERS_LDIF": "50-domain-c-users.ldif"
        }
      },
      "environment": {
        "LDAP_ORGANISATION": "Consoto Domain C",
        "LDAP_DOMAIN": "c.consoto.com",
        "LDAP_ADMIN_PASSWORD": "ldap-admin-poc-only",
        "LDAP_TLS": "false"
      },
      "volumes": [
        "domain-c-ldap:/var/lib/ldap",
        "domain-c-ldap-config:/etc/ldap/slapd.d"
      ],
      "networks": [
        "service-inout"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=c,dc=consoto,dc=com' -w \"$$LDAP_ADMIN_PASSWORD\" -b 'dc=c,dc=consoto,dc=com' -s base dn >/dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      }
    },
    "postgres": {
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_DB": "keycloak",
        "POSTGRES_USER": "keycloak",
        "POSTGRES_PASSWORD": "keycloak-poc-only"
      },
      "volumes": [
        "keycloak-db:/var/lib/postgresql/data"
      ],
      "networks": [
        "service-inout"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U keycloak"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "uem-metadata-db": {
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_DB": "uem_files",
        "POSTGRES_USER": "uem",
        "POSTGRES_PASSWORD": "uem-db-poc-only"
      },
      "volumes": [
        "uem-metadata-db:/var/lib/postgresql/data"
      ],
      "networks": [
        "uem-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U uem -d uem_files"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "uem-object-storage": {
      "image": "dxflrs/garage:v2.3.0",
      "command": [
        "/garage",
        "server",
        "--single-node",
        "--default-bucket"
      ],
      "environment": {
        "GARAGE_CONFIG_FILE": "/etc/garage.toml",
        "GARAGE_DEFAULT_ACCESS_KEY": "GK0123456789abcdef0123456789abcdef",
        "GARAGE_DEFAULT_SECRET_KEY": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "GARAGE_DEFAULT_BUCKET": "uem-uploads"
      },
      "ports": [
        "9000:3900",
        "3903:3903"
      ],
      "volumes": [
        "./garage/garage.toml:/etc/garage.toml:ro",
        "uem-object-storage-garage:/var/lib/garage"
      ],
      "networks": [
        "uem-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/garage",
          "status"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      }
    },
    "keycloak": {
      "build": {
        "context": "./keycloak",
        "args": {
          "KEYCLOAK_VERSION": "26.3.3"
        }
      },
      "command": [
        "start-dev",
        "--import-realm"
      ],
      "environment": {
        "KC_DB": "postgres",
        "KC_DB_URL": "jdbc:postgresql://postgres:5432/keycloak",
        "KC_DB_USERNAME": "keycloak",
        "KC_DB_PASSWORD": "keycloak-poc-only",
        "KC_BOOTSTRAP_ADMIN_USERNAME": "admin",
        "KC_BOOTSTRAP_ADMIN_PASSWORD": "${KEYCLOAK_ADMIN_PASSWORD:-admin-poc-only}",
        "KC_HOSTNAME_STRICT": "false",
        "KC_HTTP_ENABLED": "true",
        "KC_PROXY_HEADERS": "xforwarded",
        "KC_PROXY_TRUSTED_ADDRESSES": "172.16.0.0/12"
      },
      "ports": [
        "8080:8080"
      ],
      "networks": [
        "service-inout",
        "vdi-domain-b",
        "vdi-domain-c"
      ],
      "volumes": [
        "./keycloak/realm:/opt/keycloak/data/import:ro"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "domain-b-ldap": {
          "condition": "service_healthy"
        },
        "domain-c-ldap": {
          "condition": "service_healthy"
        }
      }
    },
    "domain-a-auth-proxy": {
      "image": "nginx:1.30.4-alpine",
      "ports": [
        "8180:8080"
      ],
      "volumes": [
        "./keycloak/domain-a-proxy/generated-nginx.conf:/etc/nginx/nginx.conf:ro"
      ],
      "networks": [
        "unsecure-domain-a",
        "service-inout"
      ],
      "depends_on": {
        "keycloak": {
          "condition": "service_started"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/domain-a/realms/uem/.well-known/openid-configuration"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "keycloak-config": {
      "image": "curlimages/curl:8.14.1",
      "environment": {
        "KEYCLOAK_ADMIN_PASSWORD": "${KEYCLOAK_ADMIN_PASSWORD:-admin-poc-only}",
        "KEYCLOAK_REALM": "uem"
      },
      "volumes": [
        "./keycloak/configure:/config:ro"
      ],
      "networks": [
        "service-inout"
      ],
      "entrypoint": [
        "/bin/sh",
        "/config/configure-user-profile.sh"
      ],
      "depends_on": [
        "keycloak"
      ]
    },
    "uem": {
      "build": "./uem",
      "environment": {
        "KEYCLOAK_REALM": "uem",
        "UEM_SESSION_SECRET": "${UEM_SESSION_SECRET:-local-poc-change-me}",
        "UEM_DOMAIN_CONFIG": "/config/domains.json",
        "UEM_DATABASE_URL": "postgresql://uem:uem-db-poc-only@uem-metadata-db:5432/uem_files",
        "UEM_S3_ENDPOINT": "http://uem-object-storage:3900",
        "UEM_S3_BUCKET": "uem-uploads",
        "UEM_S3_ACCESS_KEY": "GK0123456789abcdef0123456789abcdef",
        "UEM_S3_SECRET_KEY": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "UEM_S3_REGION": "garage",
        "UEM_CLIENT_SECRET_A": "uem-a-poc-secret",
        "UEM_CLIENT_SECRET_B": "uem-b-poc-secret",
        "UEM_CLIENT_SECRET_C": "uem-c-poc-secret",
        "UEM_LINK_CLIENT_SECRET": "uem-link-poc-secret",
        "KEYCLOAK_INTERNAL_URL": "http://domain-a-auth-proxy:8080/domain-a",
        "KEYCLOAK_PUBLIC_URL": "http://localhost:8180/domain-a",
        "KEYCLOAK_ISSUER": "http://localhost:8180/realms/uem",
        "KEYCLOAK_BACKCHANNEL_HOST": "localhost:8180",
        "UEM_PUBLIC_URL": "http://localhost:8081",
        "UEM_ALLOWED_ZONES": "a,link",
        "UEM_SESSION_COOKIE_NAME": "uem_domain_a_session"
      },
      "ports": [
        "8081:8081"
      ],
      "volumes": [
        "./config/domains.json:/config/domains.json:ro"
      ],
      "networks": [
        "unsecure-domain-a",
        "uem-data"
      ],
      "depends_on": {
        "keycloak-config": {
          "condition": "service_completed_successfully"
        },
        "uem-metadata-db": {
          "condition": "service_healthy"
        },
        "uem-object-storage": {
          "condition": "service_healthy"
        }
      }
    },
    "uem-vdi": {
      "build": "./uem",
      "environment": {
        "KEYCLOAK_REALM": "uem",
        "UEM_SESSION_SECRET": "${UEM_SESSION_SECRET:-local-poc-change-me}",
        "UEM_DOMAIN_CONFIG": "/config/domains.json",
        "UEM_DATABASE_URL": "postgresql://uem:uem-db-poc-only@uem-metadata-db:5432/uem_files",
        "UEM_S3_ENDPOINT": "http://uem-object-storage:3900",
        "UEM_S3_BUCKET": "uem-uploads",
        "UEM_S3_ACCESS_KEY": "GK0123456789abcdef0123456789abcdef",
        "UEM_S3_SECRET_KEY": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "UEM_S3_REGION": "garage",
        "UEM_CLIENT_SECRET_A": "uem-a-poc-secret",
        "UEM_CLIENT_SECRET_B": "uem-b-poc-secret",
        "UEM_CLIENT_SECRET_C": "uem-c-poc-secret",
        "UEM_LINK_CLIENT_SECRET": "uem-link-poc-secret",
        "KEYCLOAK_INTERNAL_URL": "http://keycloak:8080",
        "KEYCLOAK_PUBLIC_URL": "http://localhost:8080",
        "KEYCLOAK_ISSUER": "http://localhost:8080/realms/uem",
        "KEYCLOAK_BACKCHANNEL_HOST": "localhost:8080",
        "UEM_PUBLIC_URL": "http://localhost:8082",
        "UEM_ALLOWED_ZONES": "b",
        "UEM_SESSION_COOKIE_NAME": "uem_domain_b_session"
      },
      "ports": [
        "8082:8081"
      ],
      "volumes": [
        "./config/domains.json:/config/domains.json:ro"
      ],
      "networks": [
        "vdi-domain-b",
        "uem-data"
      ],
      "depends_on": {
        "keycloak-config": {
          "condition": "service_completed_successfully"
        },
        "uem-metadata-db": {
          "condition": "service_healthy"
        },
        "uem-object-storage": {
          "condition": "service_healthy"
        }
      }
    },
    "uem-vdi-c": {
      "build": "./uem",
      "environment": {
        "KEYCLOAK_REALM": "uem",
        "UEM_SESSION_SECRET": "${UEM_SESSION_SECRET:-local-poc-change-me}",
        "UEM_DOMAIN_CONFIG": "/config/domains.json",
        "UEM_DATABASE_URL": "postgresql://uem:uem-db-poc-only@uem-metadata-db:5432/uem_files",
        "UEM_S3_ENDPOINT": "http://uem-object-storage:3900",
        "UEM_S3_BUCKET": "uem-uploads",
        "UEM_S3_ACCESS_KEY": "GK0123456789abcdef0123456789abcdef",
        "UEM_S3_SECRET_KEY": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "UEM_S3_REGION": "garage",
        "UEM_CLIENT_SECRET_A": "uem-a-poc-secret",
        "UEM_CLIENT_SECRET_B": "uem-b-poc-secret",
        "UEM_CLIENT_SECRET_C": "uem-c-poc-secret",
        "UEM_LINK_CLIENT_SECRET": "uem-link-poc-secret",
        "KEYCLOAK_INTERNAL_URL": "http://keycloak:8080",
        "KEYCLOAK_PUBLIC_URL": "http://localhost:8080",
        "KEYCLOAK_ISSUER": "http://localhost:8080/realms/uem",
        "KEYCLOAK_BACKCHANNEL_HOST": "localhost:8080",
        "UEM_PUBLIC_URL": "http://localhost:8083",
        "UEM_ALLOWED_ZONES": "c",
        "UEM_SESSION_COOKIE_NAME": "uem_domain_c_session"
      },
      "ports": [
        "8083:8081"
      ],
      "volumes": [
        "./config/domains.json:/config/domains.json:ro"
      ],
      "networks": [
        "vdi-domain-c",
        "uem-data"
      ],
      "depends_on": {
        "keycloak-config": {
          "condition": "service_completed_successfully"
        },
        "uem-metadata-db": {
          "condition": "service_healthy"
        },
        "uem-object-storage": {
          "condition": "service_healthy"
        }
      }
    },
    "uem-cleanup": {
      "build": "./uem",
      "command": [
        "python",
        "cleanup.py"
      ],
      "environment": {
        "UEM_DATABASE_URL": "postgresql://uem:uem-db-poc-only@uem-metadata-db:5432/uem_files",
        "UEM_S3_ENDPOINT": "http://uem-object-storage:3900",
        "UEM_S3_BUCKET": "uem-uploads",
        "UEM_S3_ACCESS_KEY": "GK0123456789abcdef0123456789abcdef",
        "UEM_S3_SECRET_KEY": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "UEM_S3_REGION": "garage",
        "UEM_CLEANUP_TIMEZONE": "Europe/Zurich"
      },
      "networks": [
        "uem-data"
      ],
      "depends_on": {
        "uem": {
          "condition": "service_started"
        },
        "uem-metadata-db": {
          "condition": "service_healthy"
        },
        "uem-object-storage": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "keycloak-db": {},
    "uem-metadata-db": {},
    "uem-object-storage-garage": {},
    "domain-b-ldap": {},
    "domain-b-ldap-config": {},
    "domain-c-ldap": {},
    "domain-c-ldap-config": {}
  },
  "networks": {
    "service-inout": {},
    "unsecure-domain-a": {},
    "uem-data": {},
    "vdi-domain-b": {},
    "vdi-domain-c": {}
  }
}
