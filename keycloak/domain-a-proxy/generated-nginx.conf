# Generated from config/domains.json. Do not edit directly.
events {}

http {
    server_tokens off;

    server {
        listen 8080;

        # Only the configured UEM realm and its static login resources are exposed.
        location ^~ /domain-a/realms/uem/ {
            rewrite ^/domain-a/(.*)$ /$1 break;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /domain-a;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_path /realms/ /domain-a/realms/;
            proxy_redirect http://localhost:8180/realms/ http://localhost:8180/domain-a/realms/;
            sub_filter_once off;
            sub_filter_types text/css application/javascript;
            sub_filter 'http://localhost:8180/realms/' 'http://localhost:8180/domain-a/realms/';
            sub_filter '="/resources/' '="/domain-a/resources/';
        }

        location ^~ /domain-a/resources/ {
            rewrite ^/domain-a/(.*)$ /$1 break;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /domain-a;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / { return 404; }
    }
}
